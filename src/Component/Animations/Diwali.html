<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd166;
            --orange: #ff7b00;
            --pink: #ff2e93;
            --deep: #0b0220;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at 50% 120%, #4a0e4e 0%, #1a0536 40%, var(--deep) 100%);
            color: #fff;
            cursor: crosshair;
        }
        canvas#fx { position: fixed; inset: 0; z-index: 1; }

        /* twinkling stars */
        .stars, .stars::after {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 70% 20%, #ffe9b0, transparent),
                radial-gradient(2px 2px at 40% 70%, #fff, transparent),
                radial-gradient(1px 1px at 85% 60%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 10% 80%, #ffe9b0, transparent),
                radial-gradient(1px 1px at 55% 10%, #fff, transparent);
            background-size: 300px 300px;
            animation: twinkle 3s infinite alternate;
        }
        .stars::after { background-size: 200px 200px; animation-delay: 1.5s; }
        @keyframes twinkle { from { opacity: .3; } to { opacity: 1; } }

        /* rotating rangoli mandala */
        .mandala {
            position: fixed; left: 50%; top: 50%;
            width: min(90vmin, 800px); height: min(90vmin, 800px);
            transform: translate(-50%, -50%);
            z-index: 0; opacity: .35;
            animation: spin 60s linear infinite;
            filter: drop-shadow(0 0 25px var(--orange));
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        main {
            position: relative; z-index: 3;
            height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 20px;
            pointer-events: none;
        }
        main > * { pointer-events: auto; }
        .sub {
            letter-spacing: .5em; text-transform: uppercase;
            font-size: clamp(.7rem, 2vw, 1rem); color: var(--gold);
            animation: fadeUp 1.2s both;
        }
        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: clamp(3rem, 12vw, 9rem);
            line-height: 1;
            background: linear-gradient(90deg, #ffd166, #ff7b00, #ff2e93, #ffd166);
            background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: shimmer 4s linear infinite, fadeUp 1.4s .2s both, pulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255,123,0,.7));
            margin: 10px 0;
        }
        @keyframes shimmer { to { background-position: 300% 0; } }
        @keyframes pulse { 50% { transform: scale(1.04); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

        #wish {
            font-size: clamp(1rem, 3vw, 1.6rem); font-weight: 300;
            min-height: 2.2em; max-width: 700px;
            text-shadow: 0 0 12px rgba(255,209,102,.8);
            animation: fadeUp 1.4s .5s both;
        }
        .controls {
            margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            animation: fadeUp 1.4s .8s both;
        }
        input {
            padding: 12px 20px; border-radius: 40px; border: 1px solid var(--gold);
            background: rgba(255,255,255,.08); color: #fff; font-size: 1rem; outline: none;
            backdrop-filter: blur(6px); width: 220px; font-family: inherit;
        }
        input::placeholder { color: rgba(255,255,255,.55); }
        button {
            padding: 12px 26px; border-radius: 40px; border: none; cursor: pointer;
            font-weight: 600; font-size: 1rem; font-family: inherit; color: #2a0a00;
            background: linear-gradient(135deg, var(--gold), var(--orange));
            box-shadow: 0 0 20px rgba(255,123,0,.7);
            transition: transform .2s, box-shadow .2s;
        }
        button:hover { transform: translateY(-3px) scale(1.06); box-shadow: 0 0 35px rgba(255,209,102,.95); }
        button.alt { background: linear-gradient(135deg, var(--pink), #7b2ff7); color: #fff; box-shadow: 0 0 20px rgba(255,46,147,.6); }
        .hint { margin-top: 16px; font-size: .8rem; opacity: .6; animation: fadeUp 1.4s 1.1s both; }

        /* diyas */
        .diya-row {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
            display: flex; justify-content: space-around; align-items: flex-end;
            padding: 0 2vw; pointer-events: none;
        }
        .diya { position: relative; width: clamp(50px, 9vw, 100px); }
        .diya .bowl {
            height: clamp(18px, 3vw, 32px);
            background: linear-gradient(#e0622d, #7a1f0a);
            border-radius: 0 0 100px 100px / 0 0 100% 100%;
            box-shadow: 0 0 30px rgba(255,123,0,.5);
        }
        .diya .flame {
            position: absolute; left: 50%; bottom: 80%;
            width: 22%; height: 90%; transform: translateX(-50%);
            background: radial-gradient(ellipse at 50% 80%, #fff 0%, var(--gold) 30%, var(--orange) 65%, transparent 72%);
            border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
            animation: flicker .25s infinite alternate;
            filter: blur(.5px) drop-shadow(0 0 18px var(--orange));
            transform-origin: bottom center;
        }
        .diya:nth-child(even) .flame { animation-duration: .35s; }
        @keyframes flicker {
            from { transform: translateX(-50%) scaleY(1) rotate(-3deg); }
            to   { transform: translateX(-50%) scaleY(1.2) scaleX(.9) rotate(3deg); }
        }
        .diya .glow {
            position: absolute; left: 50%; bottom: 0; width: 300%; height: 400%;
            transform: translate(-50%, 40%);
            background: radial-gradient(circle, rgba(255,160,40,.35), transparent 60%);
            animation: glowPulse 2s infinite alternate;
        }
        @keyframes glowPulse { to { opacity: .5; } }

        /* hanging lanterns */
        .lantern {
            position: fixed; top: 0; z-index: 2; width: 46px; transform-origin: top center;
            animation: swing 3s ease-in-out infinite alternate; pointer-events: none;
        }
        .lantern::before { content: ''; display: block; width: 2px; height: var(--len); background: var(--gold); margin: 0 auto; }
        .lantern i {
            display: block; height: 62px; border-radius: 12px 12px 22px 22px;
            background: linear-gradient(#ff2e93, #ff7b00);
            box-shadow: 0 0 30px 6px rgba(255,123,0,.8), inset 0 0 14px rgba(255,255,255,.5);
            border-top: 6px solid var(--gold); border-bottom: 6px solid var(--gold);
        }
        @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

        @media (max-width: 600px) { .lantern { width: 32px; } .lantern i { height: 44px; } }

        /* ---------- extras ---------- */
        /* marigold toran */
        .toran {
            position: fixed; top: 0; left: 0; right: 0; z-index: 4; height: 54px;
            display: flex; justify-content: space-between; overflow: hidden; pointer-events: none;
            background: linear-gradient(#5a1a00cc, transparent);
        }
        .toran span { font-size: 34px; transform-origin: top center; animation: swing 2.2s ease-in-out infinite alternate; filter: drop-shadow(0 0 8px #ff9d00); }
        .toran span:nth-child(odd) { animation-delay: -1.1s; margin-top: 8px; }

        /* falling petals */
        .petal { position: fixed; top: -40px; z-index: 2; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg) translateX(var(--dx)); opacity: .6; } }

        /* multilingual greeting */
        #lang {
            font-family: 'Cinzel Decorative', serif; font-size: clamp(1.1rem, 3.5vw, 2rem);
            color: var(--gold); min-height: 1.5em; margin-bottom: 4px;
            text-shadow: 0 0 18px var(--orange); transition: opacity .5s, transform .5s;
        }
        #lang.out { opacity: 0; transform: translateY(-10px) scale(.95); }

        /* countdown */
        .countdown { display: flex; gap: 12px; margin-top: 22px; animation: fadeUp 1.4s .9s both; }
        .countdown div {
            min-width: 70px; padding: 10px 8px; border-radius: 14px;
            background: rgba(255,255,255,.08); border: 1px solid rgba(255,209,102,.5);
            backdrop-filter: blur(6px); box-shadow: 0 0 18px rgba(255,123,0,.3);
        }
        .countdown b { display: block; font-size: 1.6rem; color: var(--gold); font-variant-numeric: tabular-nums; }
        .countdown small { font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; opacity: .75; }
        #cdMsg { margin-top: 22px; font-size: 1.3rem; color: var(--gold); display: none; }

        /* interactive diyas */
        .diya { pointer-events: auto; cursor: pointer; transition: transform .2s; }
        .diya:hover { transform: translateY(-6px) scale(1.08); }
        .diya.off .flame, .diya.off .glow { opacity: 0; transform: translateX(-50%) scale(.2); animation: none; }
        .diya.off .bowl { box-shadow: none; filter: brightness(.6); }
        .diya .flame, .diya .glow { transition: opacity .4s; }
        #lit {
            position: fixed; bottom: 14px; right: 14px; z-index: 5; padding: 8px 16px; border-radius: 30px;
            background: rgba(0,0,0,.45); border: 1px solid var(--gold); font-size: .85rem; backdrop-filter: blur(6px);
        }

        /* top-right toolbar */
        .toolbar { position: fixed; top: 64px; right: 14px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
        .toolbar button {
            width: 46px; height: 46px; padding: 0; font-size: 1.3rem; border-radius: 50%;
            background: rgba(0,0,0,.45); color: #fff; border: 1px solid var(--gold); box-shadow: 0 0 12px rgba(255,209,102,.4);
        }
        .mandala.hue { filter: drop-shadow(0 0 25px var(--pink)) hue-rotate(var(--h, 0deg)); }

        /* screen flash for big booms */
        #flash { position: fixed; inset: 0; z-index: 6; background: #ffd166; opacity: 0; pointer-events: none; mix-blend-mode: overlay; }

        /* banner */
        #banner {
            position: fixed; top: 50%; left: 50%; z-index: 7; transform: translate(-50%, -50%) scale(0);
            font-family: 'Cinzel Decorative', serif; font-size: clamp(2rem, 9vw, 6rem); text-align: center; pointer-events: none;
            background: linear-gradient(90deg, #ffd166, #ff2e93); -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 30px #ff7b00);
        }
        #banner.show { animation: pop 3s ease-out forwards; }
        @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0) rotate(-10deg); } 15% { transform: translate(-50%,-50%) scale(1.1); } 80% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.3); opacity: 0; } }
        @media (max-width: 600px) { .countdown div { min-width: 56px; } .countdown b { font-size: 1.2rem; } }

        /* ---------- crazy round 2 ---------- */
        #dark { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: none; }
        .skylantern {
            position: fixed; bottom: -60px; z-index: 2; width: 26px; height: 34px; pointer-events: none;
            background: linear-gradient(#ffe29a, #ff8a00); border-radius: 6px 6px 12px 12px;
            box-shadow: 0 0 25px 8px rgba(255,150,0,.7); animation: rise linear forwards; opacity: .9;
        }
        @keyframes rise { to { transform: translate(var(--dx), -115vh) scale(.5); opacity: 0; } }
        .cracker {
            position: fixed; top: -50px; z-index: 8; font-size: 38px; cursor: pointer; user-select: none;
            animation: drop linear forwards; filter: drop-shadow(0 0 10px #ff2e93);
        }
        @keyframes drop { to { transform: translateY(115vh) rotate(var(--r)); } }
        #score {
            position: fixed; top: 64px; left: 14px; z-index: 9; display: none; padding: 8px 16px; border-radius: 30px;
            background: rgba(0,0,0,.6); border: 1px solid var(--pink); font-weight: 600;
        }
        body.shake { animation: shake .45s; }
        @keyframes shake { 20% { transform: translate(-8px, 5px); } 40% { transform: translate(7px, -6px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 5px); } }
        .controls button.mega { background: linear-gradient(135deg, #00e5ff, #7b2ff7, var(--pink)); background-size: 200% 200%; color: #fff; animation: shimmer 2s linear infinite; }

        /* ---------- mobile layout ---------- */
        main { justify-content: safe center; overflow-y: auto; height: 100dvh; -webkit-overflow-scrolling: touch; }
        @media (max-width: 700px) {
            main { padding: 110px 16px 130px; }       /* clear toran + toolbar on top, diyas at bottom */
            .sub { letter-spacing: .25em; font-size: .7rem; }
            h1 { font-size: clamp(2.6rem, 15vw, 4.5rem); margin: 6px 0 10px; }
            #lang { font-size: 1.15rem; }
            #wish { font-size: 1rem; min-height: 4.2em; max-width: 92vw; }

            /* controls: full-width input, two-column button grid */
            .controls { width: 100%; max-width: 380px; gap: 10px; margin-top: 14px; }
            .controls { flex-wrap: wrap; }
            .controls input { flex: 1 1 0; min-width: 0; width: auto; padding: 12px 16px; font-size: .9rem; }   /* input + send side by side */
            .controls #wishBtn { flex: 0 0 auto; padding: 12px 16px; font-size: .85rem; white-space: nowrap; }
            .controls #showBtn { flex: 1 1 100%; padding: 12px 8px; font-size: .85rem; }
            .controls button.mega, #gameBtn, #waBtn { display: none; }   /* hidden on mobile */

            .countdown { gap: 8px; margin-top: 18px; }
            .countdown div { min-width: 60px; padding: 8px 6px; }
            .countdown b { font-size: 1.25rem; }
            .hint { font-size: .72rem; max-width: 280px; }

            /* toolbar becomes a full-width tab bar pinned to the bottom; diyas sit just above it */
            main { padding: 100px 16px 200px; }
            .diya-row { bottom: 54px; }
            .toolbar { top: auto; bottom: 0; left: 0; right: 0; transform: none; flex-direction: row; gap: 0; padding: 0 0 env(safe-area-inset-bottom);
                border-radius: 0; background: rgba(12,2,32,.92); backdrop-filter: blur(10px);
                border-top: 1px solid var(--gold); }
            .toolbar button { flex: 1; width: auto; height: 54px; border-radius: 0; border: 0; box-shadow: none; background: none;
                font-size: 1.25rem; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
                border-right: 1px solid rgba(255,209,102,.18); }
            .toolbar button:last-child { border-right: 0; }
            .toolbar button:hover, .toolbar button:active { transform: none; background: rgba(255,209,102,.15); box-shadow: inset 0 -3px 0 var(--gold); }
            .toolbar button::after { font-size: .6rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); }
            #darkBtn::after { content: 'Torch'; } #sndBtn::after { content: 'Sound'; } #hueBtn::after { content: 'Colour'; }
            #chakraBtn::after { content: 'Chakra'; } #sparkBtn::after { content: 'Sparkle'; }

            .toran { height: 44px; } .toran span { font-size: 26px; }
            #lit { bottom: auto; top: 56px; z-index: 5; right: 50%; transform: translateX(50%); font-size: .75rem; padding: 5px 12px; white-space: nowrap; }
            #score { top: 92px; left: 50%; transform: translateX(-50%); font-size: .8rem; white-space: nowrap; }

            .lantern[style*="left:20%"], .lantern[style*="left:78%"] { display: none; }   /* keep outer two only */
            .mandala { opacity: .25; }
            .diya { width: 52px; }
            .skylantern { width: 18px; height: 24px; }
            #banner { font-size: 2.2rem; width: 90vw; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <!-- rangoli mandala -->
    <svg class="mandala" viewBox="-200 -200 400 400" aria-hidden="true">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff7b00"/><stop offset="1" stop-color="#ff2e93"/>
            </linearGradient>
        </defs>
        <g fill="none" stroke="url(#g)" stroke-width="2" id="petals"></g>
        <circle r="190" fill="none" stroke="url(#g)" stroke-dasharray="2 8" stroke-width="3"/>
        <circle r="30" fill="url(#g)" opacity=".7"/>
    </svg>

    <canvas id="fx"></canvas>

    <div class="lantern" style="left:6%;  --len:40px;  animation-delay:0s"><i></i></div>
    <div class="lantern" style="left:20%; --len:90px;  animation-delay:-1s"><i></i></div>
    <div class="lantern" style="left:78%; --len:70px;  animation-delay:-2s"><i></i></div>
    <div class="lantern" style="left:92%; --len:110px; animation-delay:-.5s"><i></i></div>

    <div class="toran" id="toran"></div>
    <div id="flash"></div>
    <div id="banner"></div>

    <canvas id="dark"></canvas>
    <div id="score">🧨 Score: <b id="scoreN">0</b> · ⏱ <b id="timeN">30</b>s</div>

    <div class="toolbar">
        <button id="darkBtn" title="Torch / night mode">🔦</button>
        <button id="sndBtn" title="Sound on/off">🔇</button>
        <button id="hueBtn" title="Change rangoli colours">🎨</button>
        <button id="chakraBtn" title="Light a chakra">🌀</button>
        <button id="sparkBtn" title="Sparkler trail on/off">✨</button>
    </div>
    <div id="lit">🪔 Diyas lit: <b id="litN">0</b></div>

    <main>
        <p class="sub">✦ Festival of Lights ✦</p>
        <div id="lang">शुभ दीपावली</div>
        <h1>Happy Diwali</h1>
        <p id="wish"></p>
        <div class="controls">
            <input id="name" type="text" placeholder="Enter a name to wish…" maxlength="30">
            <button id="wishBtn">Send Wishes 🪔</button>
            <button id="showBtn" class="alt">Fireworks Show 🎆</button>
            <button id="grandBtn" class="mega">GRAND SHOW 🚀</button>
            <button id="gameBtn" class="alt">Cracker Game 🧨</button>
            <button id="waBtn" class="alt">Share on WhatsApp 💬</button>
        </div>
        <div class="countdown" id="cd">
            <div><b id="cdD">0</b><small>Days</small></div>
            <div><b id="cdH">0</b><small>Hours</small></div>
            <div><b id="cdM">0</b><small>Min</small></div>
            <div><b id="cdS">0</b><small>Sec</small></div>
        </div>
        <p id="cdMsg">🪔 Today is Diwali — Happy Diwali! 🪔</p>
        <p class="hint">Tap anywhere for fireworks · tap the diyas to light them · light them all for a surprise</p>
    </main>

    <div class="diya-row" id="diyas"></div>

    <script>
        // build mandala petals
        const petals = document.getElementById('petals');
        let p = '';
        for (let i = 0; i < 16; i++) {
            p += `<g transform="rotate(${i * 22.5})">
                <path d="M0 -40 C 30 -90, 30 -130, 0 -170 C -30 -130, -30 -90, 0 -40Z"/>
                <path d="M0 -60 C 15 -90, 15 -110, 0 -130 C -15 -110, -15 -90, 0 -60Z"/>
                <circle cy="-180" r="6"/>
            </g>`;
        }
        petals.innerHTML = p;

        // diyas
        const diyas = document.getElementById('diyas');
        const count = Math.max(5, Math.floor(innerWidth / 130));
        for (let i = 0; i < count; i++) {
            diyas.insertAdjacentHTML('beforeend',
                '<div class="diya"><div class="glow"></div><div class="flame"></div><div class="bowl"></div></div>');
        }

        // fireworks + embers
        const cv = document.getElementById('fx');
        const ctx = cv.getContext('2d');
        let W, H;
        function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
        addEventListener('resize', resize); resize();

        const rockets = [], sparks = [], embers = [];
        const colors = [45, 25, 330, 280, 190, 10, 60];

        function launch(x, y) {
            rockets.push({ x: x ?? Math.random() * W, y: H, ty: y ?? H * (0.15 + Math.random() * 0.4), vy: -9 - Math.random() * 3, hue: colors[Math.floor(Math.random() * colors.length)] });
        }
        function burst(x, y, hue) {
            const n = 90 + Math.floor(Math.random() * 60);
            const type = Math.floor(Math.random() * 3);
            for (let i = 0; i < n; i++) {
                const a = Math.PI * 2 * i / n;
                let s = type === 1 ? 4 + (i % 2) * 3 : 1 + Math.random() * 5;
                if (type === 2) s *= 1 + 0.5 * Math.sin(a * 5); // flower shape
                sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: hue + Math.random() * 30 - 15, g: .05 });
            }
        }
        // rising embers
        for (let i = 0; i < 60; i++) embers.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 2 + .5, v: Math.random() * .8 + .3, ph: Math.random() * 6 });

        function frame() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0,0,0,.2)';
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'lighter';

            for (const e of embers) {
                e.y -= e.v; e.x += Math.sin(e.y / 40 + e.ph) * .4;
                if (e.y < -5) { e.y = H + 5; e.x = Math.random() * W; }
                ctx.fillStyle = 'rgba(255,170,60,.8)';
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
            }
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                r.y += r.vy; r.vy += .08;
                ctx.fillStyle = `hsl(${r.hue},100%,70%)`;
                ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, 7); ctx.fill();
                if (r.y <= r.ty || r.vy >= 0) { burst(r.x, r.y, r.hue); rockets.splice(i, 1); }
            }
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy; s.vy += s.g; s.vx *= .985; s.vy *= .985; s.life -= s.d || .012;
                if (s.life <= 0) { sparks.splice(i, 1); continue; }
                ctx.fillStyle = `hsla(${s.hue},100%,${55 + s.life * 25}%,${s.d ? Math.min(1, s.life * 3) : s.life})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, 2 * s.life + .5, 0, 7); ctx.fill();
            }
            if (Math.random() < .02) launch();
            requestAnimationFrame(frame);
        }
        frame();

        addEventListener('pointerdown', e => {
            if (e.target.closest('input, button')) return;
            launch(e.clientX, e.clientY);
        });

        // wishes
        const wishes = [
            'May the festival of lights fill your life with joy, prosperity and endless happiness.',
            'May Goddess Lakshmi bless you and your family with wealth and good fortune.',
            'Light a diya, spread a smile — may every dark corner glow with hope.',
            'Wishing you a Diwali as bright as a thousand sparklers!',
            'May this Diwali burn away all worries and light up your dreams.'
        ];
        const wishEl = document.getElementById('wish');
        const nameEl = document.getElementById('name');
        let typing;
        function typeWish(text) {
            clearInterval(typing); wishEl.textContent = '';
            let i = 0;
            typing = setInterval(() => {
                wishEl.textContent += text[i++];
                if (i >= text.length) clearInterval(typing);
            }, 35);
        }
        function sendWish() {
            const n = nameEl.value.trim();
            const w = wishes[Math.floor(Math.random() * wishes.length)];
            typeWish((n ? `Dear ${n}, ` : '') + (n ? w.charAt(0).toLowerCase() + w.slice(1) : w));
            for (let i = 0; i < 4; i++) setTimeout(() => launch(), i * 200);
        }
        document.getElementById('wishBtn').onclick = sendWish;
        nameEl.addEventListener('keydown', e => e.key === 'Enter' && sendWish());
        document.getElementById('showBtn').onclick = () => {
            for (let i = 0; i < 25; i++) setTimeout(() => launch(), i * 220);
        };

        typeWish(wishes[0]);
        setTimeout(() => { for (let i = 0; i < 5; i++) setTimeout(() => launch(), i * 300); }, 600);

        /* ================= EXTRAS ================= */

        // ---- sound (synthesised, no files) ----
        let AC = null, soundOn = false;
        function boom(big) {
            if (!soundOn || !AC) return;
            const t = AC.currentTime, len = big ? 1.2 : 0.6;
            const buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
            const src = AC.createBufferSource(); src.buffer = buf;
            const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = big ? 500 : 900;
            const g = AC.createGain(); g.gain.value = big ? 0.9 : 0.4;
            src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
        }
        function chime() {
            if (!soundOn || !AC) return;
            const t = AC.currentTime;
            [660, 880, 1320].forEach((fr, i) => {
                const o = AC.createOscillator(), g = AC.createGain();
                o.type = 'sine'; o.frequency.value = fr;
                g.gain.setValueAtTime(0.15, t + i * 0.08); g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.9);
                o.connect(g); g.connect(AC.destination); o.start(t + i * 0.08); o.stop(t + i * 0.08 + 1);
            });
        }
        // hook into existing burst
        const _burst = burst;
        burst = function (x, y, hue) { _burst(x, y, hue); boom(false); };
        const sndBtn = document.getElementById('sndBtn');
        sndBtn.onclick = () => {
            if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
            soundOn = !soundOn; sndBtn.textContent = soundOn ? '🔊' : '🔇';
            if (soundOn) { AC.resume(); chime(); }
        };

        // ---- toran (marigold garland) ----
        const toran = document.getElementById('toran');
        const tn = Math.ceil(innerWidth / 38);
        for (let i = 0; i < tn; i++) toran.insertAdjacentHTML('beforeend', `<span>${['🌼', '🏵️', '🪷'][i % 3]}</span>`);

        // ---- falling petals ----
        function petal() {
            const el = document.createElement('div');
            el.className = 'petal'; el.textContent = ['🌼', '🌸', '🏵️', '🧡'][Math.floor(Math.random() * 4)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = 12 + Math.random() * 18 + 'px';
            el.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
            el.style.animationDuration = 6 + Math.random() * 6 + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 12500);
        }
        setInterval(petal, 700);

        // ---- rotating multilingual greeting ----
        const langs = ['शुभ दीपावली', 'শুভ দীপাবলি', 'தீபாவளி நல்வாழ்த்துக்கள்', 'దీపావళి శుభాకాంక్షలు', 'ദീപാവലി ആശംസകൾ',
            'ಶುಭ ದೀಪಾವಳಿ', 'શુભ દિવાળી', 'ਦੀਵਾਲੀ ਮੁਬਾਰਕ', 'दिवाळीच्या शुभेच्छा', 'Happy Deepavali', 'Feliz Diwali', 'दीपावली की हार्दिक शुभकामनाएँ'];
        let li = 0; const langEl = document.getElementById('lang');
        setInterval(() => {
            langEl.classList.add('out');
            setTimeout(() => { li = (li + 1) % langs.length; langEl.textContent = langs[li]; langEl.classList.remove('out'); }, 500);
        }, 2600);

        // ---- countdown to Diwali 2026 (8 Nov) ----
        const target = new Date(2026, 10, 8, 18, 0, 0);
        function tick() {
            const diff = target - new Date();
            if (diff <= 0) {
                document.getElementById('cd').style.display = 'none';
                document.getElementById('cdMsg').style.display = 'block';
                return;
            }
            const s = Math.floor(diff / 1000);
            document.getElementById('cdD').textContent = Math.floor(s / 86400);
            document.getElementById('cdH').textContent = Math.floor(s % 86400 / 3600);
            document.getElementById('cdM').textContent = Math.floor(s % 3600 / 60);
            document.getElementById('cdS').textContent = s % 60;
        }
        tick(); setInterval(tick, 1000);

        // ---- interactive diyas ----
        const diyaEls = [...document.querySelectorAll('.diya')];
        const litN = document.getElementById('litN');
        diyaEls.forEach((d, i) => { if (i % 2) d.classList.add('off'); }); // half start unlit
        let finaleDone = false;
        function updateLit() {
            const n = diyaEls.filter(d => !d.classList.contains('off')).length;
            litN.textContent = `${n}/${diyaEls.length}`;
            if (n === diyaEls.length && !finaleDone) { finaleDone = true; finale(); }
            if (n < diyaEls.length) finaleDone = false;
        }
        diyaEls.forEach(d => d.addEventListener('click', () => {
            d.classList.toggle('off');
            if (!d.classList.contains('off')) {
                const r = d.getBoundingClientRect(); chime();
                launch(r.left + r.width / 2, H * 0.3);
            }
            updateLit();
        }));
        updateLit();

        // ---- finale when every diya is lit ----
        const banner = document.getElementById('banner'), flash = document.getElementById('flash');
        function say(text) {
            banner.textContent = text; banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
        }
        function finale() {
            say('✨ Shubh Deepavali! ✨');
            for (let i = 0; i < 50; i++) setTimeout(() => launch(), i * 120);
            for (let i = 0; i < 40; i++) setTimeout(petal, i * 60);
            flash.animate([{ opacity: .8 }, { opacity: 0 }], { duration: 900 }); boom(true);
        }

        // ---- cursor sparkler trail ----
        let sparkler = true;
        document.getElementById('sparkBtn').onclick = () => sparkler = !sparkler;
        addEventListener('pointermove', e => {
            if (!sparkler) return;
            for (let i = 0; i < 3; i++) {
                const a = Math.random() * 6.28, s = Math.random() * 2.5;
                sparks.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: .7, hue: 35 + Math.random() * 25, g: .08 });
            }
        });

        // ---- ground chakra (spinning wheel of sparks) ----
        const chakras = [];
        function chakra() {
            chakras.push({ x: W * (0.2 + Math.random() * 0.6), y: H - 60, a: 0, t: 220, hue: Math.random() * 360 });
            boom(false);
        }
        document.getElementById('chakraBtn').onclick = chakra;
        (function chakraLoop() {
            for (let i = chakras.length - 1; i >= 0; i--) {
                const c = chakras[i]; c.a += 0.5; c.t--;
                for (let k = 0; k < 3; k++) {
                    const ang = c.a + k * 2.09, sp = 3 + Math.random() * 2;
                    sparks.push({ x: c.x, y: c.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1, life: .8, hue: c.hue + c.t, g: .06 });
                }
                if (c.t <= 0) chakras.splice(i, 1);
            }
            requestAnimationFrame(chakraLoop);
        })();

        // ---- rangoli colour shifter ----
        const mandala = document.querySelector('.mandala');
        let hueDeg = 0;
        document.getElementById('hueBtn').onclick = () => {
            hueDeg = (hueDeg + 60) % 360;
            mandala.classList.add('hue'); mandala.style.setProperty('--h', hueDeg + 'deg');
            chime();
        };

        // ---- WhatsApp share ----
        document.getElementById('waBtn').onclick = () => {
            const n = nameEl.value.trim();
            const msg = `🪔✨ ${n ? 'Dear ' + n + ', ' : ''}Happy Diwali! ✨🪔\n${wishEl.textContent || wishes[0]}\n\n🎆 Light up your own: ${location.href}`;
            window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
        };

        // ---- keyboard: space = big volley, c = chakra ----
        addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); for (let i = 0; i < 8; i++) setTimeout(() => launch(), i * 90); }
            if (e.key === 'c') chakra();
        });

        /* ================= ROUND 2: EVEN CRAZIER ================= */

        function shake() { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); }

        // ---- shaped fireworks: sparks fly to form points of a shape / word ----
        function shapeBurst(points, cx, cy, hue) {
            const d = 0.008, n = Math.round(1 / d), k = (1 - Math.pow(.985, n)) / .015;
            points.forEach(([px, py], i) => {
                sparks.push({ x: cx, y: cy, vx: px / k, vy: py / k, life: 1, d, g: 0, hue: hue + (i % 40) });
            });
            boom(true);
        }
        function textPoints(text, size) {
            const c = document.createElement('canvas'), x = c.getContext('2d');
            c.width = size * text.length * 0.9 + 40; c.height = size * 1.6;
            x.font = `bold ${size}px sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
            x.fillStyle = '#fff'; x.fillText(text, c.width / 2, c.height / 2);
            const data = x.getImageData(0, 0, c.width, c.height).data, pts = [], step = Math.max(3, Math.round(size / 14));
            for (let yy = 0; yy < c.height; yy += step) for (let xx = 0; xx < c.width; xx += step)
                if (data[(yy * c.width + xx) * 4 + 3] > 128) pts.push([xx - c.width / 2, yy - c.height / 2]);
            return pts;
        }
        const heartPts = (s) => Array.from({ length: 160 }, (_, i) => { const t = i / 160 * 6.283;
            return [s * 16 * Math.pow(Math.sin(t), 3), -s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]; });
        const starPts = (R) => { const a = []; for (let i = 0; i < 10; i++) for (let j = 0; j < 14; j++) {
            const r1 = i % 2 ? R * .45 : R, r2 = (i + 1) % 2 ? R * .45 : R, t1 = i * Math.PI / 5 - Math.PI / 2, t2 = (i + 1) * Math.PI / 5 - Math.PI / 2, f = j / 14;
            a.push([(r1 * Math.cos(t1)) * (1 - f) + (r2 * Math.cos(t2)) * f, (r1 * Math.sin(t1)) * (1 - f) + (r2 * Math.sin(t2)) * f]); } return a; };
        const spiralPts = (R) => Array.from({ length: 200 }, (_, i) => { const t = i / 200 * 18; return [Math.cos(t) * R * i / 200, Math.sin(t) * R * i / 200]; });

        function rocketTo(x, y, cb) {
            // visible streak rising to target, then callback
            const r = { x, y: H, ty: y, vy: -14, hue: 45, cb };
            rockets.push(r);
        }
        // the main loop calls burst() when a rocket arrives; rockets carrying a callback run it instead
        const _burst2 = burst;
        burst = function (x, y, hue) {
            const r = rockets.find(r => r.cb && r.x === x && r.y === y);
            if (r) { r.cb(x, y); return; }
            _burst2(x, y, hue);
        };

        function shapeShot(pts, x, y, hue) { rocketTo(x, y, (cx, cy) => { shapeBurst(pts, cx, cy, hue); shake(); }); }

        // ---- GRAND SHOW: choreographed sequence ----
        let showing = false;
        document.getElementById('grandBtn').onclick = () => {
            if (showing) return; showing = true;
            const cx = W / 2, sz = Math.min(W / 8, 120), seq = [
                () => { for (let i = 0; i < 6; i++) setTimeout(() => launch(), i * 180); },
                () => shapeShot(textPoints('DIWALI', sz), cx, H * .35, 40),
                () => shapeShot(heartPts(Math.min(W / 40, 14)), cx, H * .4, 330),
                () => shapeShot(starPts(Math.min(W / 6, 160)), cx, H * .38, 190),
                () => shapeShot(textPoints('ॐ', sz * 1.4), cx, H * .38, 30),
                () => shapeShot(spiralPts(Math.min(W / 4, 220)), cx, H * .4, 280),
                () => shapeShot(textPoints('शुभ दीपावली', sz * .8), cx, H * .35, 20),
                () => { for (let i = 0; i < 40; i++) setTimeout(() => launch(), i * 90); say('🪔 Happy Diwali! 🪔'); for (let i = 0; i < 30; i++) setTimeout(petal, i * 80); },
            ];
            seq.forEach((fn, i) => setTimeout(fn, i * 2600));
            setTimeout(() => showing = false, seq.length * 2600 + 3000);
        };

        // ---- torch / night mode: room goes dark, cursor + lit diyas glow ----
        const dark = document.getElementById('dark'), dctx = dark.getContext('2d');
        let darkOn = false, mx = innerWidth / 2, my = innerHeight / 2;
        addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
        function sizeDark() { dark.width = innerWidth; dark.height = innerHeight; }
        addEventListener('resize', sizeDark); sizeDark();
        function hole(x, y, r, a) {
            const g = dctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
            dctx.fillStyle = g; dctx.fillRect(x - r, y - r, r * 2, r * 2);
        }
        (function darkLoop() {
            if (darkOn) {
                dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, dark.width, dark.height);
                dctx.fillStyle = 'rgba(3,0,12,.88)'; dctx.fillRect(0, 0, dark.width, dark.height);
                dctx.globalCompositeOperation = 'destination-out';
                hole(mx, my, 170 + Math.sin(performance.now() / 120) * 8, 1);
                diyaEls.forEach(d => { if (d.classList.contains('off')) return;
                    const r = d.getBoundingClientRect(); hole(r.left + r.width / 2, r.top, 230, .95); });
                sparks.forEach(s => { if (s.life > .5 && Math.random() < .02) hole(s.x, s.y, 60, .6); });
            }
            requestAnimationFrame(darkLoop);
        })();
        document.getElementById('darkBtn').onclick = () => {
            darkOn = !darkOn; dark.style.display = darkOn ? 'block' : 'none';
            if (darkOn) say('Light the diyas…'); chime();
        };

        // ---- sky lanterns (kandils) drifting up ----
        function skyLantern() {
            const el = document.createElement('div'); el.className = 'skylantern';
            el.style.left = Math.random() * 100 + 'vw'; el.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
            el.style.animationDuration = 9 + Math.random() * 7 + 's';
            document.body.appendChild(el); setTimeout(() => el.remove(), 17000);
        }
        setInterval(skyLantern, 2200);

        // ---- cracker catching game ----
        let gScore = 0, gTime = 0, gTimer = null, gSpawn = null;
        const scoreBox = document.getElementById('score');
        document.getElementById('gameBtn').onclick = () => {
            if (gTimer) return;
            gScore = 0; gTime = 30; scoreBox.style.display = 'block';
            document.getElementById('scoreN').textContent = 0; document.getElementById('timeN').textContent = gTime;
            say('GO! Tap the crackers 🧨');
            gSpawn = setInterval(() => {
                const el = document.createElement('div'); el.className = 'cracker';
                const bomb = Math.random() < .15;
                el.textContent = bomb ? '💣' : ['🧨', '🎇', '🎆', '🚀'][Math.floor(Math.random() * 4)];
                el.style.left = Math.random() * (innerWidth - 50) + 'px';
                el.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
                el.style.animationDuration = 2.2 + Math.random() * 2 + 's';
                el.onpointerdown = ev => {
                    ev.stopPropagation();
                    const r = el.getBoundingClientRect(), x = r.left + 20, y = r.top + 20;
                    _burst2(x, y, bomb ? 0 : colors[Math.floor(Math.random() * colors.length)]); boom(bomb);
                    if (bomb) { gScore = Math.max(0, gScore - 3); shake(); } else gScore++;
                    document.getElementById('scoreN').textContent = gScore; el.remove();
                };
                document.body.appendChild(el); setTimeout(() => el.remove(), 4500);
            }, 450);
            gTimer = setInterval(() => {
                document.getElementById('timeN').textContent = --gTime;
                if (gTime <= 0) {
                    clearInterval(gTimer); clearInterval(gSpawn); gTimer = null;
                    document.querySelectorAll('.cracker').forEach(c => c.remove());
                    say(`🎉 Score: ${gScore}! 🎉`); for (let i = 0; i < 12; i++) setTimeout(() => launch(), i * 150);
                    setTimeout(() => scoreBox.style.display = 'none', 3000);
                }
            }, 1000);
        };

        // ---- shake-free tilt: double-click anywhere = mega burst ----
        addEventListener('dblclick', e => {
            if (e.target.closest('input, button, .diya')) return;
            for (let i = 0; i < 3; i++) burst(e.clientX, e.clientY, colors[Math.floor(Math.random() * colors.length)]);
            flash.animate([{ opacity: .5 }, { opacity: 0 }], { duration: 500 }); boom(true);
        });
    </script>
</body>
</html>
